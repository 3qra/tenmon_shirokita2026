                amount: { type: integer, minimum: 1 }
                medium: { $ref: '#/components/schemas/CashMedium' }
                reason: { type: string, default: 開始釣銭 }
      responses:
        '201':
          description: 登録
          headers:
            Idempotent-Replay:
              $ref: '#/components/headers/IdempotentReplay'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /treasurer/cash/reconciliations:
    post:
      tags: [treasurer]
      operationId: treasurerReconcile
      summary: 締め精算
      description: |
        必要権限: treasurer / admin。`Idempotency-Key` 必須。
        実残高と理論残高の差額を調整明細として記録する。差額があるのに `note` が空なら `400`。
        未確定の移動がある `422 pending_transfers`。`counted_by` 省略時は自分。
      x-roles: [treasurer, admin]
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [cash_account_id, actual_balance]
              properties:
                cash_account_id: { type: string, format: uuid }
                medium: { $ref: '#/components/schemas/CashMedium' }
                actual_balance: { type: integer, minimum: 0 }
                counted_by: { type: string, format: uuid, description: 数えた部員の ID }
                note: { type: string }
      responses:
        '201':
          description: 精算結果
          headers:
            Idempotent-Replay:
              $ref: '#/components/headers/IdempotentReplay'
          content:
            application/json:
              schema:
                type: object
                required: [id, theoretical_balance, actual_balance, difference]
                properties:
                  id: { type: string, format: uuid }
                  theoretical_balance: { type: integer }
                  actual_balance: { type: integer }
                  difference: { type: integer, description: actual − theoretical }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    get:
      tags: [treasurer]
      operationId: treasurerListReconciliations
      summary: 精算履歴（最新 300 件）
      description: '必要権限: treasurer / admin'
      x-roles: [treasurer, admin]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Reconciliation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /treasurer/sales:
    get:
      tags: [treasurer]
      operationId: treasurerSales
      summary: 売上集計（JSON または CSV）
      description: |
        必要権限: treasurer / admin。
        注文数・数量・値引前金額・値引額・入金・返金・純売上（入金−返金）・未払いを集計。釣銭や現金移動は含まない。
        取消かつ未払いの注文、支払前に取消された明細は除外。
        返金は注文単位で 1 回だけ、その注文の最初の明細が属する行に計上する（商品別なら最初の商品）。
        合計行の `orders` は行と同じ条件で数えた注文の重複なし件数。
        `format=csv` のとき UTF-8（BOM 付き）CSV を `Content-Disposition: attachment; filename="sales_<group>.csv"` で返す。
        CSV 列: `<集計単位>,注文数,数量,値引前金額,値引額,入金,返金,純売上,未払い`、最終行は「合計」。
      x-roles: [treasurer, admin]
      parameters:
        - name: from
          in: query
          description: 営業日の開始（含む）
          schema: { type: string, format: date }
        - name: to
          in: query
          description: 営業日の終了（含む）
          schema: { type: string, format: date }
        - name: group
          in: query
          description: 集計単位（day=営業日, department=部門, product=商品（選択肢込み）, hour=時間帯 JST, cashier=入金担当者）
          schema:
            type: string
            enum: [day, department, product, hour, cashier]
            default: day
        - name: format
          in: query
          schema:
            type: string
            enum: [csv]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesReport' }
            text/csv:
              schema:
                type: string
              example: "﻿部門,注文数,数量,値引前金額,値引額,入金,返金,純売上,未払い\nやきうどん,2,4,1600,0,800,0,800,800\n合計,2,4,1600,0,800,0,800,800\n"
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

