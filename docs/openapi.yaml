        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /staff/orders/{id}/handoff/revert:
    post:
      tags: [staff-orders]
      operationId: staffHandoffRevert
      summary: 受け渡しの訂正（未受渡に戻す）
      description: '必要権限: cashier / treasurer / admin。受渡済みでない `409 not_handed`。'
