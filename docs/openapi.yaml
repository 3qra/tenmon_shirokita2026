          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [screening_id, party_size]
              properties:
                screening_id: { type: string, format: uuid }
                party_size: { type: integer, minimum: 1, maximum: 50 }
                name: { type: string }
                admit_now: { type: boolean, default: false }
      responses:
        '201':
          description: 作成された予約（トークン・URL付き）
          headers:
            Idempotent-Replay:
              $ref: '#/components/headers/IdempotentReplay'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Reservation'
                  - type: object
                    required: [access_token, url]
                    properties:
                      access_token: { type: string }
                      url: { type: string, format: uri }
