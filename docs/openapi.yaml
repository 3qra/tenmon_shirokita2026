        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /staff/kitchen:
    get:
      tags: [staff-orders]
      operationId: staffKitchen
      summary: キッチン表示（今日・未受渡・調理が必要な注文）
      description: |
        必要権限: kitchen / cashier / admin。受付中の注文と、10 分以内に取消された注文を含む。
        明細は調理が必要なもののみ。作成順。
