      operationId: staffWalkin
      summary: 当日受付
      description: |
        必要権限: reception / admin。`Idempotency-Key` 必須。人数 1〜50。
        `admit_now: true` なら全チケットを同時に入場済みにする。
        中止 `422 screening_cancelled`、終了 `422 finished`、残席不足 `422 not_enough_seats`。
