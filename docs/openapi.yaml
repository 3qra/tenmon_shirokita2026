          schema: { type: string, format: date }
        - name: filter
          in: query
          description: |
            `active`=受付中（既定）, `unpaid`=受付中かつ未払い,
            `ready`=受付中・未受渡で調理待ち／調理中の明細が無いもの（受渡可能）, `all`=すべて
          schema:
            type: string
            enum: [active, unpaid, ready, all]
