    post:
      tags: [shifts]
      operationId: staffRequestExchange
      summary: シフト交代の申請
      description: |
        必要権限: ログインのみ。自分の有効な配置のみ（他人 `403`）。相手が既に同じ枠に配置 `422 already_assigned`。
        同じ配置に未完了の申請がある `409 duplicate`。
      x-roles: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [assignment_id, to_member_id]
              properties:
                assignment_id: { type: string, format: uuid }
                to_member_id: { type: string, format: uuid }
                reason: { type: string }
      responses:
        '201':
          description: 申請作成
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /staff/shift-exchanges/{id}/respond:
    post:
      tags: [shifts]
      operationId: staffRespondExchange
      summary: 交代依頼への回答・取り下げ
      description: |
        必要権限: ログインのみ。
        `accept`/`decline` は依頼された本人のみ（状態 requested のとき）。`cancel` は申請者のみ（requested/accepted のとき）。
        それ以外の `action`（`approve`/`reject` を含む）は `400`。状態不一致 `409 state_changed`。
      x-roles: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExchangeResponseAction' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

