      description: |
        必要権限: cashier / treasurer / admin。受付中・未払いの注文のみ（それ以外 `409 not_editable`）。
        明細を請求から除外し小計・合計を減らす。全明細が取消になると注文自体も取消。既に取消 `409 already_cancelled`。
      x-roles: [cashier, treasurer, admin]
      parameters:
        - $ref: '#/components/parameters/IdPath'
