        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /staff/orders/{id}/payment:
    post:
      tags: [staff-orders]
      operationId: staffPayment
      summary: 会計（入金確定）
      description: |
        必要権限: cashier / treasurer / admin。`Idempotency-Key` 必須。
        クーポン消費・入金・現金明細を同一トランザクションで確定する。
        * 取消済み `409 cancelled`、会計済み `409 already_paid`、`expected_total` と不一致 `409 total_changed`、
          クーポン状態変化 `409 coupon_changed`。
        * 預かり不足 `422 insufficient`、金券へのお釣り（設定 `voucher_change_allowed` が false）`422 voucher_change`。
        * 保管先 `cash_account_id` 省略時は自分の財布（無ければ `422 no_wallet`）。他人の財布 `403`、
          金庫への直接入金は treasurer / admin のみ。
      x-roles: [cashier, treasurer, admin]
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                cash_received: { type: integer, minimum: 0, default: 0 }
                voucher_received: { type: integer, minimum: 0, default: 0, description: 金券での受領額 }
                coupons:
                  type: array
                  items: { $ref: '#/components/schemas/CouponUse' }
                expected_total:
                  type: integer
                  description: 画面に表示した請求額。指定時はサーバー計算と一致しなければ 409。
                cash_account_id:
                  type: string
                  format: uuid
                  description: 入金先の保管先（省略時は自分の財布）
      responses:
        '200':
          description: 会計後の注文
          headers:
            Idempotent-Replay:
              $ref: '#/components/headers/IdempotentReplay'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffOrder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /staff/orders/{id}/refund:
    post:
      tags: [staff-orders]
      operationId: staffRefund
      summary: 返金
      description: |
        必要権限: treasurer / admin。`Idempotency-Key` 必須。現金（medium=cash）で返金明細を記録する。
        未払い `409 unpaid`、累計が入金額を超える `422 refund_exceeds`。
        `cancel_order: true` かつ受付中なら注文も取消。`restore_coupons: true` なら適用済みクーポン利用をすべて取消して残人数を戻す。
        `restore_coupons` はこの返金で全額返金（payment_status=refunded）になる場合のみ可（それ以外 `422 partial_refund_restore`）。
      x-roles: [treasurer, admin]
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amount, reason]
              properties:
                amount: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 1, maxLength: 200 }
                cash_account_id: { type: string, format: uuid, description: 出金元（省略時は自分の財布） }
                cancel_order: { type: boolean, default: false }
                restore_coupons: { type: boolean, default: false, description: 全額返金時のみ指定可 }
      responses:
        '200':
          description: 返金後の注文
          headers:
            Idempotent-Replay:
              $ref: '#/components/headers/IdempotentReplay'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffOrder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

