      tags: [admin]
      operationId: adminUpdateScreening
      summary: 上映枠の更新
      description: |
        必要権限: admin。公開・受付・開催状態は独立に変更可。`run_status: cancelled` は不可（専用操作を使う, `400`）。
        `visibility`・`booking_status`・`run_status` の不正値、空の `title` は `400`。
        `run_status` は scheduled → running → finished の順にしか進められない（戻すと `422 invalid_transition`）。
        中止済み `409 cancelled`。確保済み人数未満の定員 `422 capacity_below_taken`、予約済み未満の予約枠 `422 quota_below_reserved`。
        定員が予約枠を下回るなど DB 制約違反は `400 invalid_value`。
        `run_status: finished` にすると入場者へのクーポン自動発券を行う。応答は計算値（`taken`, `symbol` 等）を含む。
      x-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title: { type: string, minLength: 1, maxLength: 50 }
                capacity: { type: integer, minimum: 1 }
                reserve_quota: { type: integer, minimum: 0 }
                clear_reserve_quota: { type: boolean, default: false, description: true で予約枠を無制限（null）に }
                visibility: { $ref: '#/components/schemas/Visibility' }
                booking_status: { $ref: '#/components/schemas/BookingStatus' }
                run_status:
                  type: string
                  enum: [scheduled, running, finished]
                booking_opens_at: { type: string, format: date-time }
                booking_closes_at: { type: string, format: date-time }
      responses:
        '200':
          description: 更新後の上映
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Screening' }
