      summary: 配置の解除
      description: '必要権限: admin。未完了の交代申請は取消。有効な配置でない `409 not_active`。'
      x-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/shift-exchanges/{id}/decide:
    post:
      tags: [admin]
      operationId: adminDecideExchange
      summary: シフト交代の承認・却下
      description: |
        必要権限: admin。相手が承諾済み（accepted）の申請のみ（それ以外 `409 state_changed`）。
        承認すると元の配置を外し相手の配置を作成。元の配置が変わっていれば `409 assignment_changed`。
        `action` は `approve`/`reject` のみ（それ以外 `400`）。
      x-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExchangeDecision' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/audit-logs:
    get:
      tags: [admin]
      operationId: adminAuditLogs
      summary: 監査ログ
      description: '必要権限: admin。新しい順。'
      x-roles: [admin]
      parameters:
        - name: target_type
          in: query
          schema: { type: string }
          example: order
        - name: target_id
          in: query
          schema: { type: string }
        - name: limit
          in: query
          description: 件数（既定 200）。1〜1000 の範囲外・数値でない値は既定の 200 とみなす（エラーにならない）
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditLog' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: gs_session
      description: |
        ログイン時に設定される HttpOnly セッション Cookie。Cookie 認証で状態を変える要求には
        `X-Requested-With` ヘッダが必要（CSRF 対策）。
    bearerAuth:
      type: http
      scheme: bearer
      description: '`POST /auth/login` の `token`。Authorization ヘッダ付きの要求は CSRF ヘッダ不要。'

  headers:
    IdempotentReplay:
      description: 保存済みの応答を再送した場合に `true`
      schema:
        type: string
        enum: ['true']

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: UUID（形式不正は 404）
      schema: { type: string, format: uuid }
    TokenPath:
      name: token
      in: path
      required: true
      description: 推測困難な秘密トークン（base64url）
      schema: { type: string }
    DayQuery:
      name: day
      in: query
      required: false
      description: 営業日 `YYYY-MM-DD`（形式不正は 400）
      schema: { type: string, format: date }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: クライアントが生成する推測困難な操作 ID（最大 200 文字）。再送時は同じ値を使う。
      schema: { type: string, maxLength: 200 }
    XRequestedWith:
      name: X-Requested-With
      in: header
      required: false
      description: |
        `Authorization` ヘッダを送らない状態変更要求では必須（CSRF 対策, 無いと `403 csrf`）。値は任意。
      schema: { type: string }
      example: XMLHttpRequest
    XClientId:
      name: X-Client-Id
      in: header
      required: false
      description: アプリの来場者識別値（16〜200 文字）。送る場合は `X-Client-Kind` も必須。
      schema: { type: string, minLength: 16, maxLength: 200 }
    XClientKind:
      name: X-Client-Kind
      in: header
      required: false
      description: アプリの種類（`X-Client-Id` を送る場合は必須）
      schema:
        type: string
        enum: [appclip, ios, android]
    ClientCookie:
      name: gs_cid
      in: cookie
      required: false
      description: Web 来場者識別 Cookie（16〜100 文字）。無ければサーバーが発行する。
      schema: { type: string }

  responses:
    Ok:
      description: 成功
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OkResponse' }
    BadRequest:
      description: 入力不正（`bad_request`, `invalid_value`, `invalid_credentials`(パスワード変更)）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: 未ログイン（`unauthorized`）・ログイン失敗（`invalid_credentials`）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 権限不足・ブロック中（`forbidden`）、CSRF ヘッダ不足（`csrf`）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 対象が無い（`not_found`）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: 状態の競合（`ErrorCode` の 409 系を参照）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unprocessable:
      description: 業務ルール違反（`ErrorCode` の 422 系を参照）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: 頻度制限（`rate_limited`, `locked`, `site_code_locked`）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: サーバーエラー（`internal`, `no_stream`）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    # ---------------- 共通 ----------------
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message:
              type: string
              description: 利用者向けの日本語メッセージ
            details:
              type: object
              additionalProperties: true
              description: 追加情報（現状の実装では未使用）
      example:
        error:
          code: sold_out
          message: やきうどん（しょうゆ / 中）は売り切れです

    ErrorCode:
      type: string
      description: |
        | HTTP | code | 意味 |
        |---|---|---|
        | 400 | bad_request | 入力不正・Idempotency-Key 不足・外部キー不正 |
        | 400 | invalid_credentials | 現在のパスワードが違う（パスワード変更） |
        | 401 | unauthorized | ログインが必要 |
        | 401 | invalid_credentials | ID またはパスワードが違う（ログイン） |
        | 403 | forbidden | 権限不足・来場者識別のブロック |
        | 403 | csrf | `X-Requested-With` 不足 |
        | 404 | not_found | 対象が無い |
        | 400 | invalid_value | DB の CHECK 制約違反（値の範囲・組み合わせが不正） |
        | 409 | duplicate / overlap / retry | DB 一意・排他制約違反・再試行 |
        | 409 | in_progress | 同じ Idempotency-Key を処理中 |
        | 409 | already_admitted, already_cancelled, already_lifted, already_paid, assignment_changed, cancelled, cooking_started, coupon_changed, decided, duplicate_issue, not_active, not_admitted, not_applied, not_cancellable, not_editable, not_handable, not_handed, not_ready, order_closed, paid, state_changed, ticket_void, total_changed, unpaid | 状態の競合 |
        | 422 | idempotency_mismatch | 同じキーで異なる内容 |
        | 422 | already_assigned, balance_remaining, booking_closed, cancel_deadline, capacity_below_taken, coupon_expired, coupon_inactive, coupon_issue_limit, coupon_no_target, coupon_not_applicable, coupon_not_combinable, coupon_not_yet, coupon_persons, coupon_revoked, coupon_used, finished, full, insufficient, insufficient_balance, invalid_item, invalid_transition, item_stopped, item_unavailable, mobile_order_off, no_identity, no_wallet, not_enough_seats, not_open, order_still_paid, partial_refund_restore, pending_transfers, quota_below_reserved, refund_exceeds, screening_cancelled, site_code_invalid, sold_out, too_many_items, too_many_reservations, too_many_unpaid, voucher_change | 業務ルール違反 |
        | 429 | rate_limited / locked / site_code_locked | 頻度制限・ロック |
        | 500 | internal / no_stream | サーバーエラー |
        | 503 | wallet_disabled | Apple Wallet 未設定 |
      enum:
        - bad_request
        - invalid_credentials
        - unauthorized
        - forbidden
        - csrf
        - not_found
        - invalid_value
        - duplicate
        - overlap
        - retry
        - in_progress
        - already_admitted
        - already_cancelled
        - already_lifted
        - already_paid
        - assignment_changed
        - cancelled
        - cooking_started
        - coupon_changed
        - decided
        - duplicate_issue
        - not_active
        - not_admitted
        - not_applied
        - not_cancellable
        - not_editable
        - not_handable
        - not_handed
        - not_ready
        - order_closed
        - paid
        - state_changed
        - ticket_void
        - total_changed
        - unpaid
        - idempotency_mismatch
        - already_assigned
        - balance_remaining
        - booking_closed
        - cancel_deadline
        - capacity_below_taken
        - coupon_expired
        - coupon_inactive
        - coupon_issue_limit
        - coupon_no_target
        - coupon_not_applicable
        - coupon_not_combinable
        - coupon_not_yet
        - coupon_persons
        - coupon_revoked
        - coupon_used
        - finished
        - full
        - insufficient
        - insufficient_balance
        - invalid_item
        - invalid_transition
        - item_stopped
        - item_unavailable
        - mobile_order_off
        - no_identity
        - no_wallet
        - not_enough_seats
        - not_open
        - order_still_paid
        - partial_refund_restore
        - pending_transfers
        - quota_below_reserved
        - refund_exceeds
        - screening_cancelled
        - site_code_invalid
        - sold_out
        - too_many_items
        - too_many_reservations
        - too_many_unpaid
        - voucher_change
        - rate_limited
        - locked
        - site_code_locked
        - internal
        - no_stream
        - wallet_disabled

    OkResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, const: true }

    IdResponse:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }

    ReasonRequired:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 200 }

    Role:
      type: string
      enum: [admin, cashier, kitchen, reception, treasurer, member, display]

    Visibility:
      type: string
      enum: [public, hidden]
      default: public

    SaleStatus:
      type: string
      enum: [on_sale, sold_out, stopped]

    BusinessStatus:
      type: string
      enum: [before, open, paused, closed]

    DepartmentKind:
      type: string
      enum: [food, planetarium, goods]

    CashMedium:
      type: string
      enum: [cash, voucher]
      default: cash

    CashAccountKind:
      type: string
      enum: [wallet, safe, register]

    TransferStatus:
      type: string
      enum: [pending, confirmed, rejected, cancelled]

    BookingStatus:
      type: string
      enum: [open, paused, closed]

    RunStatus:
      type: string
      enum: [scheduled, running, finished, cancelled]

    BlockScope:
      type: string
      enum: [order, reservation, both]

    ShiftPreference:
      type: string
      enum: [want, ok, ng]

    BusinessDaysResponse:
      type: object
      required: [days, today]
      properties:
        days:
          type: array
          items:
            type: object
            required: [id, day, label]
            properties:
              id: { type: string, format: uuid }
              day: { type: string, format: date }
              label: { type: string }
        today: { type: string, format: date, description: Asia/Tokyo 基準の今日 }

    # ---------------- 認証・部員 ----------------
    Staff:
      type: object
      required: [id, name, login_id, roles]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        login_id: { type: string }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }

    LoginResponse:
      type: object
      required: [token, expires_at, staff]
      properties:
        token: { type: string, description: セッショントークン（Bearer 用。Cookie と同値） }
        expires_at: { type: string, format: date-time }
        staff: { $ref: '#/components/schemas/Staff' }

    Member:
      type: object
      required: [id, name, login_id, active, created_at, roles, wallet_account_id]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        login_id: { type: string }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
        wallet_account_id:
          type: [string, 'null']
          format: uuid
          description: 有効な個人財布の保管先 ID

    MemberInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 50 }
        login_id: { type: string, maxLength: 50, description: 作成時のみ有効 }
        password: { type: string, minLength: 8 }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
        active: { type: boolean, description: 更新時のみ有効 }
        create_wallet: { type: boolean, default: true, description: 作成時のみ有効 }

    Notification:
      type: object
      required: [id, kind, title, body, link, read_at, created_at]
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          description: 例 `cash_transfer`, `shift`, `shift_exchange`
        title: { type: string }
        body: { type: string }
        link: { type: string, description: Web 画面への相対パス }
        read_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }

    AuditLog:
      type: object
      required: [id, action, target_type, target_id, detail, created_at, member_name]
      properties:
        id: { type: integer }
        action: { type: string, example: order.cancel }
        target_type: { type: string }
        target_id: { type: string }
        detail:
          type: object
          additionalProperties: true
        created_at: { type: string, format: date-time }
        member_name: { type: [string, 'null'] }

    Limits:
      type: object
      properties:
        seat_threshold_percent: { type: integer, minimum: 1, maximum: 100, default: 70, description: 空席△の閾値（%） }
        unpaid_warn_minutes: { type: integer, default: 15 }
        cooking_warn_minutes: { type: integer, default: 15 }
        max_unpaid_orders: { type: integer, minimum: 1, default: 2 }
        max_items_per_order: { type: integer, minimum: 1, default: 10 }
        max_party_size: { type: integer, minimum: 1, default: 6 }
        max_future_reservations: { type: integer, minimum: 1, default: 2 }
        site_code_fail_limit: { type: integer, minimum: 1, default: 5 }
        site_code_fail_window_min: { type: integer, minimum: 1, default: 10 }
        orders_per_minute: { type: integer, minimum: 1, default: 3 }
        reservations_per_minute: { type: integer, minimum: 1, default: 3 }
        display_stale_seconds: { type: integer, minimum: 1, default: 30 }
        visitor_cancel_before_min: { type: integer, default: 0, description: 上映開始の何分前まで本人取消可 }

    # ---------------- 部門・表示 ----------------
    Department:
      type: object
      required: [id, code, name, kind, business_status, mobile_order_enabled, site_code_enabled,
                 site_code_interval_sec, site_code_grace_sec, notice, sort_order]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        kind: { $ref: '#/components/schemas/DepartmentKind' }
        business_status: { $ref: '#/components/schemas/BusinessStatus' }
        mobile_order_enabled: { type: boolean }
        site_code_enabled: { type: boolean }
        site_code_interval_sec: { type: integer }
        site_code_grace_sec: { type: integer }
        notice: { type: string }
        sort_order: { type: integer }

    BoardResponse:
      type: object
      required: [department, cooking, ready, server_time]
      properties:
        department:
          type: object
          required: [id, name, business_status, mobile_order_enabled, site_code_enabled, notice]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            business_status: { $ref: '#/components/schemas/BusinessStatus' }
            mobile_order_enabled: { type: boolean }
            site_code_enabled: { type: boolean }
            notice: { type: string }
        cooking:
          type: array
          description: 調理待ち・調理中の呼出番号
          items: { type: integer }
        ready:
          type: array
          description: 受渡可能な呼出番号
          items: { type: integer }
        server_time: { type: string, format: date-time }

    SiteCode:
      type: object
      required: [enabled, server_time]
      properties:
        enabled: { type: boolean }
        code: { type: string, pattern: '^[0-9]{3}$', description: enabled=true のときのみ }
        valid_from: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
        server_time: { type: string, format: date-time }

    DisplayStatus:
      type: object
      required: [name, screen, last_seen_at, department_name, stale]
      properties:
        name: { type: string, description: 端末アカウントの部員名 }
        screen: { type: string }
        last_seen_at: { type: string, format: date-time }
        department_name: { type: [string, 'null'] }
        stale: { type: boolean }

    # ---------------- 商品 ----------------
    CatalogResponse:
      type: object
      required: [department, products]
      properties:
        department: { $ref: '#/components/schemas/Department' }
        products:
          type: array
          items: { $ref: '#/components/schemas/Product' }

    Product:
      type: object
      required: [id, department_id, name, description, needs_cooking, visibility, active, sort_order, option_groups, variants]
      properties:
        id: { type: string, format: uuid }
        department_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        needs_cooking: { type: boolean }
        visibility: { $ref: '#/components/schemas/Visibility' }
        active: { type: boolean }
        sort_order: { type: integer }
        option_groups:
          type: array
          items: { $ref: '#/components/schemas/OptionGroup' }
        variants:
          type: array
          items: { $ref: '#/components/schemas/Variant' }

    OptionGroup:
      type: object
      required: [id, name, sort_order, active, values]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: 味 }
        sort_order: { type: integer }
        active: { type: boolean }
        values:
          type: array
          items: { $ref: '#/components/schemas/OptionValue' }

    OptionValue:
      type: object
      required: [id, name, sort_order, active]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: しょうゆ }
        sort_order: { type: integer }
        active: { type: boolean }

    Variant:
      type: object
      description: 選択肢の組み合わせごとの価格・販売状態
      required: [id, price, visibility, sale_status, active, sort_order, option_value_ids, label]
      properties:
        id: { type: string, format: uuid }
        price: { type: integer }
        visibility: { $ref: '#/components/schemas/Visibility' }
        sale_status: { $ref: '#/components/schemas/SaleStatus' }
        active: { type: boolean }
        sort_order: { type: integer }
        option_value_ids:
          type: array
          items: { type: string, format: uuid }
        label: { type: string, example: しょうゆ / 中, description: 選択肢名を ' / ' で連結（選択肢なしは空文字） }

    OptionGroupInput:
      type: object
      additionalProperties: false
      required: [name, values]
      properties:
        name: { type: string, minLength: 1, maxLength: 30 }
        values:
          type: array
          minItems: 1
          items: { type: string, minLength: 1, maxLength: 30 }

    OptionUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 30 }
        active: { type: boolean }
        sort_order: { type: integer }

    # ---------------- 注文 ----------------
    ItemRequest:
      type: object
      additionalProperties: false
      required: [variant_id, quantity]
      properties:
        variant_id: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 99, description: 同じ variant_id は合算される }

    PricedItem:
      type: object
      required: [variant_id, product_id, product_name, options_label, options, unit_price, quantity, line_total, needs_cooking]
      properties:
        variant_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        product_name: { type: string }
        options_label: { type: string }
        options:
          type: array
          items:
            type: object
            required: [group, value, value_id]
            properties:
              group: { type: string }
              value: { type: string }
              value_id: { type: string, format: uuid }
        unit_price: { type: integer }
        quantity: { type: integer }
        line_total: { type: integer }
        needs_cooking: { type: boolean }

    PublicOrderCreated:
      type: object
      required: [id, call_number, total, access_token, status_url]
      properties:
        id: { type: string, format: uuid }
        call_number: { type: integer, description: 部門・営業日ごとの呼出番号 }
        total: { type: integer }
        access_token: { type: string, description: '注文確認用トークン（`/public/orders/by-token/{token}`）' }
        status_url: { type: string, format: uri, description: '`<PUBLIC_BASE_URL>/o/<token>`' }

    OrderStatus:
      type: string
      enum: [accepted, cancelled, completed]

    PaymentStatus:
      type: string
      enum: [unpaid, paid, partially_refunded, refunded]

    HandoffStatus:
      type: string
      enum: [pending, handed]

    CookStatus:
      type: string
      enum: [waiting, cooking, cooked, cancelled, not_required]

    OrderChannel:
      type: string
      enum: [staff, web, appclip, ios, android]

    OrderItem:
      type: object
      description: 注文明細（販売時点のスナップショット）
      required: [id, product_name, options_label, unit_price, quantity, line_total, discount, needs_cooking, cook_status, variant_id, product_id]
      properties:
        id: { type: string, format: uuid }
        product_name: { type: string }
        options_label: { type: string }
        unit_price: { type: integer }
        quantity: { type: integer }
        line_total: { type: integer }
        discount: { type: integer, description: この明細に配分された割引額 }
        needs_cooking: { type: boolean }
        cook_status: { $ref: '#/components/schemas/CookStatus' }
        variant_id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }

    OrderCouponRedemption:
      type: object
      description: 注文に適用されたクーポン利用記録
      required: [id, coupon_no, name, persons, discount, status, forfeited_persons]
      properties:
        id: { type: string, format: uuid, description: '利用記録 ID（`/staff/redemptions/{id}/reverse` に使う）' }
        coupon_no: { type: string, example: C-ACD347 }
        name: { type: string }
        persons: { type: integer }
        discount: { type: integer }
        status: { type: string, enum: [applied, reversed] }
        forfeited_persons: { type: integer, description: 分割不可のため失効した人数 }

    Order:
      type: object
      description: 注文詳細（来場者向け）
      required: [id, department_id, department_name, business_day, call_number, channel, status, payment_status,
                 handoff_status, subtotal, discount, total, created_at, handed_at, items, coupons, ready]
      properties:
        id: { type: string, format: uuid }
        department_id: { type: string, format: uuid }
        department_name: { type: string }
        business_day: { type: string, format: date }
        call_number: { type: integer }
        channel: { $ref: '#/components/schemas/OrderChannel' }
        status: { $ref: '#/components/schemas/OrderStatus' }
        payment_status: { $ref: '#/components/schemas/PaymentStatus' }
        handoff_status: { $ref: '#/components/schemas/HandoffStatus' }
        subtotal: { type: integer }
        discount: { type: integer }
        total: { type: integer }
        created_at: { type: string, format: date-time }
        handed_at: { type: [string, 'null'], format: date-time }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
        coupons:
          type: array
          items: { $ref: '#/components/schemas/OrderCouponRedemption' }
        ready:
          type: boolean
          description: 受付中で、調理待ち・調理中の明細が無く、有効な明細が 1 つ以上ある

    Payment:
      type: object
      required: [id, amount, cash_received, voucher_received, change_given, created_at, member_name, cash_account_name, refunded]
      properties:
        id: { type: string, format: uuid }
        amount: { type: integer, description: 請求額（割引後） }
        cash_received: { type: integer }
        voucher_received: { type: integer }
        change_given: { type: integer }
        created_at: { type: string, format: date-time }
        member_name: { type: string }
        cash_account_name: { type: [string, 'null'] }
        refunded: { type: integer, description: この入金に対する返金累計 }

    Refund:
      type: object
      required: [id, amount, reason, created_at, member_name]
      properties:
        id: { type: string, format: uuid }
        amount: { type: integer }
        reason: { type: string }
        created_at: { type: string, format: date-time }
        member_name: { type: string }

    OrderEvent:
      type: object
      required: [id, kind, from, to, reason, created_at, member_name]
      properties:
        id: { type: integer }
        kind:
          type: string
          description: create / cook / cook_correction / item_cancel / cancel / payment / refund / handoff / handoff_correction
        from: { type: [string, 'null'] }
        to: { type: [string, 'null'] }
        reason: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        member_name: { type: [string, 'null'] }

    StaffOrder:
      description: 注文詳細（スタッフ向け。支払・返金・履歴を含む）
      allOf:
        - $ref: '#/components/schemas/Order'
        - type: object
          required: [has_client_identity, created_by_name, handed_by_name, cancel_reason, unpaid_handoff_reason, payments, refunds, events]
          properties:
            has_client_identity: { type: boolean, description: 来場者識別がある（ブロック可能） }
            created_by_name: { type: [string, 'null'] }
            handed_by_name: { type: [string, 'null'] }
            cancel_reason: { type: [string, 'null'] }
            unpaid_handoff_reason: { type: [string, 'null'] }
            payments:
              type: array
              items: { $ref: '#/components/schemas/Payment' }
            refunds:
              type: array
              items: { $ref: '#/components/schemas/Refund' }
            events:
              type: array
              items: { $ref: '#/components/schemas/OrderEvent' }

    OrderSummary:
      type: object
      description: 注文一覧の 1 行
      required: [id, call_number, channel, status, payment_status, handoff_status, subtotal, discount, total,
                 created_at, elapsed_sec, unpaid_warning, items, ready]
      properties:
        id: { type: string, format: uuid }
        call_number: { type: integer }
        channel: { $ref: '#/components/schemas/OrderChannel' }
        status: { $ref: '#/components/schemas/OrderStatus' }
        payment_status: { $ref: '#/components/schemas/PaymentStatus' }
        handoff_status: { $ref: '#/components/schemas/HandoffStatus' }
        subtotal: { type: integer }
        discount: { type: integer }
        total: { type: integer }
        created_at: { type: string, format: date-time }
        elapsed_sec: { type: integer }
        unpaid_warning: { type: boolean, description: 未払いのまま `unpaid_warn_minutes` 経過 }
        items:
          type: array
          items:
            type: object
            required: [id, product_name, options_label, quantity, line_total, cook_status]
            properties:
              id: { type: string, format: uuid }
              product_name: { type: string }
              options_label: { type: string }
              quantity: { type: integer }
              line_total: { type: integer }
              cook_status: { $ref: '#/components/schemas/CookStatus' }
        ready: { type: boolean }

    KitchenOrder:
      type: object
      required: [id, call_number, payment_status, status, channel, created_at, elapsed_sec, long_wait, unpaid_warning, items]
      properties:
        id: { type: string, format: uuid }
        call_number: { type: integer }
        payment_status: { $ref: '#/components/schemas/PaymentStatus' }
        status: { $ref: '#/components/schemas/OrderStatus' }
        channel: { $ref: '#/components/schemas/OrderChannel' }
        created_at: { type: string, format: date-time }
        elapsed_sec: { type: integer }
        long_wait: { type: boolean, description: '`cooking_warn_minutes` 以上経過' }
        unpaid_warning: { type: boolean }
        items:
          type: array
          description: 調理が必要な明細のみ
          items:
            type: object
            required: [id, product_name, options_label, quantity, cook_status, updated_at]
            properties:
              id: { type: string, format: uuid }
              product_name: { type: string }
              options_label: { type: string }
              quantity: { type: integer }
              cook_status: { $ref: '#/components/schemas/CookStatus' }
              updated_at: { type: string, format: date-time }

    # ---------------- クーポン ----------------
    CouponUse:
      type: object
      additionalProperties: false
      required: [token, persons]
      properties:
        token: { type: string, description: クーポン QR のトークン }
        persons: { type: integer, minimum: 1, description: 利用人数（残人数以下） }

    CouponLine:
      type: object
      description: 見積でのクーポン適用結果
      required: [issued_coupon_id, coupon_no, name, persons, discount, forfeited_persons]
      properties:
        issued_coupon_id: { type: string, format: uuid }
        coupon_no: { type: string }
        name: { type: string }
        persons: { type: integer }
        discount: { type: integer }
        forfeited_persons: { type: integer }
        note: { type: string, description: 分割利用不可で残人数が失効する場合の注意 }

    PaymentQuote:
      type: object
      required: [subtotal, discount, total, coupons]
      properties:
        subtotal: { type: integer }
        discount: { type: integer }
        total: { type: integer }
        coupons:
          type: array
          items: { $ref: '#/components/schemas/CouponLine' }

    CouponSnapshot:
      type: object
      description: 発券時に固定された条件（定義の変更は遡及しない）
      required: [name, description, discount_type, discount_value, scope, target_product_ids, target_variant_ids,
                 items_per_person, allocation, holder_mode, splittable, combinable]
      properties:
        name: { type: string }
        description: { type: string }
        discount_type: { type: string, enum: [fixed, percent], description: 'fixed=円, percent=％（1円未満切捨て）' }
        discount_value: { type: integer }
        scope: { type: string, enum: [order, items], description: 'order=注文全体, items=対象商品' }
        target_department_id: { type: string, format: uuid, description: 指定時はその部門のみ（省略=全部門） }
        target_product_ids:
          type: array
          items: { type: string, format: uuid }
        target_variant_ids:
          type: array
          items: { type: string, format: uuid }
        items_per_person: { type: integer, description: 'scope=items のとき 1 人あたりの割引点数' }
        allocation: { type: string, enum: [highest_price_first, lowest_price_first] }
        max_discount: { type: integer, description: 割引上限（円） }
        holder_mode: { type: string, enum: [per_person, group], description: 自動発券時に 1 人 1 枚か、予約単位 1 枚か }
        splittable: { type: boolean, description: false なら一部人数で使うと残りは失効 }
        combinable: { type: boolean, description: 他クーポンとの併用可否 }
        valid_from: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }

    CouponStatus:
      type: string
      enum: [active, used, revoked]

    CouponVerifyResult:
      type: object
      required: [id, coupon_no, status, persons_total, persons_remaining, conditions, usable, summary]
      properties:
        id: { type: string, format: uuid }
        coupon_no: { type: string }
        status: { $ref: '#/components/schemas/CouponStatus' }
        persons_total: { type: integer }
        persons_remaining: { type: integer }
        conditions: { $ref: '#/components/schemas/CouponSnapshot' }
        usable: { type: boolean }
        summary: { type: string, example: 対象商品1点/人まで1点50円引き・併用不可 }
        reason: { type: string, description: usable=false の理由 }

    PublicCoupon:
      type: object
      required: [id, coupon_no, name, description, conditions, persons_total, persons_remaining, status,
                 valid_from, valid_until, created_at, summary, token]
      properties:
        id: { type: string, format: uuid }
        coupon_no: { type: string }
        name: { type: string }
        description: { type: string }
        conditions: { $ref: '#/components/schemas/CouponSnapshot' }
        persons_total: { type: integer }
        persons_remaining: { type: integer }
        status: { $ref: '#/components/schemas/CouponStatus' }
        valid_from: { type: [string, 'null'], format: date-time }
        valid_until: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        summary: { type: string }
        token: { type: string, description: 要求パスのトークン（QR 表示用） }

    CouponDefinitionInput:
      type: object
      additionalProperties: false
      required: [name, discount_type, discount_value, scope]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        description: { type: string }
        discount_type: { type: string, enum: [fixed, percent] }
        discount_value: { type: integer, minimum: 1, description: percent は 100 以下 }
        scope: { type: string, enum: [order, items] }
        target_department_id: { type: string, format: uuid }
        target_product_ids:
          type: array
          description: scope=items では target_product_ids / target_variant_ids の少なくとも 1 つが必須
          items: { type: string, format: uuid }
        target_variant_ids:
          type: array
          items: { type: string, format: uuid }
        items_per_person: { type: integer, minimum: 1, default: 1 }
        allocation: { type: string, enum: [highest_price_first, lowest_price_first], default: highest_price_first }
        max_discount: { type: [integer, 'null'], minimum: 1 }
        holder_mode: { type: string, enum: [per_person, group], default: per_person }
        splittable: { type: boolean, default: false }
        combinable: { type: boolean, default: false }
        valid_from: { type: [string, 'null'], format: date-time }
        valid_until: { type: [string, 'null'], format: date-time }
        max_issues: { type: [integer, 'null'], minimum: 1 }
        auto_issue: { type: string, enum: [none, screening_attended], default: none, description: 'screening_attended=上映終了後、入場者に自動発券' }
        active: { type: boolean, description: 作成時の既定 true、更新時は省略で現状維持 }

    CouponDefinition:
      type: object
      required: [id, name, description, discount_type, discount_value, scope, target_department_id, items_per_person,
                 allocation, max_discount, holder_mode, splittable, combinable, valid_from, valid_until, max_issues,
                 auto_issue, active, created_by, created_at, updated_at, target_product_ids, target_variant_ids,
                 issued_count, used_persons]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        discount_type: { type: string, enum: [fixed, percent] }
        discount_value: { type: integer }
        scope: { type: string, enum: [order, items] }
        target_department_id: { type: [string, 'null'], format: uuid }
        items_per_person: { type: integer }
        allocation: { type: string, enum: [highest_price_first, lowest_price_first] }
        max_discount: { type: [integer, 'null'] }
        holder_mode: { type: string, enum: [per_person, group] }
        splittable: { type: boolean }
        combinable: { type: boolean }
        valid_from: { type: [string, 'null'], format: date-time }
        valid_until: { type: [string, 'null'], format: date-time }
        max_issues: { type: [integer, 'null'] }
        auto_issue: { type: string, enum: [none, screening_attended] }
        active: { type: boolean }
        created_by: { type: [string, 'null'], format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        target_product_ids:
          type: array
          items: { type: string, format: uuid }
        target_variant_ids:
          type: array
          items: { type: string, format: uuid }
        issued_count: { type: integer }
        used_persons: { type: integer, description: 適用中の利用人数の合計 }

    IssuedCoupon:
      type: object
      description: 発券済みクーポン（管理一覧）
      required: [id, public_no, definition_id, name, persons_total, persons_remaining, status, valid_from, valid_until,
                 source_kind, created_at, revoke_reason, reservation_no]
      properties:
        id: { type: string, format: uuid }
        public_no: { type: string, example: C-ACD347 }
        definition_id: { type: string, format: uuid }
        name: { type: string }
        persons_total: { type: integer }
        persons_remaining: { type: integer }
        status: { $ref: '#/components/schemas/CouponStatus' }
        valid_from: { type: [string, 'null'], format: date-time }
        valid_until: { type: [string, 'null'], format: date-time }
        source_kind: { type: string, enum: [auto_screening, manual] }
        created_at: { type: string, format: date-time }
        revoke_reason: { type: [string, 'null'] }
        reservation_no: { type: [string, 'null'], description: 自動発券元の予約番号 }

    ManuallyIssuedCoupon:
      type: object
      required: [id, coupon_no, token, url]
      properties:
        id: { type: string, format: uuid }
        coupon_no: { type: string }
        token: { type: string }
        url: { type: string, format: uri, description: '`<PUBLIC_BASE_URL>/c/<token>`' }

    # ---------------- プラネタリウム ----------------
    SeatSymbol:
      type: string
      enum: ['○', '△', '×']
      description: '○=空席あり, △=確保人数が閾値以上, ×=満席'

    Screening:
      type: object
      description: 上映（スタッフ向け、内訳・計算値付き）
      required: [id, department_id, title, business_day, starts_at, ends_at, capacity, reserve_quota, reserved_count,
                 walkin_count, booking_opens_at, booking_closes_at, visibility, booking_status, run_status, manually_edited,
                 admitted_count, taken, symbol, status_text, advance_available, walkin_available, advance_open]
      properties:
        id: { type: string, format: uuid }
        department_id: { type: string, format: uuid }
        title: { type: string }
        business_day: { type: string, format: date }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        capacity: { type: integer }
        reserve_quota: { type: [integer, 'null'], description: 事前予約に割り当てる上限（null=定員まで） }
        reserved_count: { type: integer, description: 事前予約の確保人数 }
        walkin_count: { type: integer, description: 当日受付の確保人数 }
        booking_opens_at: { type: [string, 'null'], format: date-time }
        booking_closes_at: { type: [string, 'null'], format: date-time }
        visibility: { $ref: '#/components/schemas/Visibility' }
        booking_status: { $ref: '#/components/schemas/BookingStatus' }
        run_status: { $ref: '#/components/schemas/RunStatus' }
        manually_edited: { type: boolean }
        cancel_reason: { type: string, description: 中止時のみ }
        admitted_count: { type: integer }
        taken: { type: integer, description: reserved_count + walkin_count }
        symbol: { $ref: '#/components/schemas/SeatSymbol' }
        status_text: { type: string, description: '上映中止 / 上映終了 / 上映中 / 受付停止中 / 受付終了 / 受付開始前 / 事前予約終了 / 空' }
        advance_available: { type: integer, description: 事前予約で確保できる残り人数 }
        walkin_available: { type: integer, description: 当日受付で確保できる残り人数 }
        advance_open: { type: boolean, description: 現在事前予約を受け付けているか }

    PublicScreening:
      type: object
      required: [id, title, business_day, starts_at, ends_at, symbol, status_text, advance_open, advance_available, walkin_available, run_status]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        business_day: { type: string, format: date }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        symbol: { $ref: '#/components/schemas/SeatSymbol' }
        status_text: { type: string }
        advance_open: { type: boolean }
        advance_available: { type: boolean }
        walkin_available: { type: boolean, description: 当日枠に空きがあり、run_status=scheduled }
        run_status: { $ref: '#/components/schemas/RunStatus' }

    PublicScreeningDetail:
      allOf:
        - $ref: '#/components/schemas/PublicScreening'
        - type: object
          required: [max_party_size]
          properties:
            max_party_size: { type: integer, description: 'min(max_party_size 設定, 事前予約の残り人数)' }

    ScreeningBoardItem:
      type: object
      required: [id, title, starts_at, ends_at, symbol, status_text, run_status, advance_open, walkin_available]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        symbol: { $ref: '#/components/schemas/SeatSymbol' }
        status_text: { type: string }
        run_status: { $ref: '#/components/schemas/RunStatus' }
        advance_open: { type: boolean, description: 受付中かつ残りあり }
        walkin_available: { type: boolean }

    ReservationCreated:
      type: object
      required: [id, reservation_no, access_token, url]
      properties:
        id: { type: string, format: uuid }
        reservation_no: { type: string, example: 17-001, description: '`DD-NNN`（営業日の日・通番）' }
        access_token: { type: string }
        url: { type: string, format: uri, description: '`<PUBLIC_BASE_URL>/r/<token>`' }

    ReservationStatus:
      type: string
      enum: [confirmed, cancelled_self, cancelled_staff, cancelled_screening]

    Ticket:
      type: object
      description: 入場チケット（1 人 1 枚）
      required: [id, seq, ticket_no, status, admitted_at]
      properties:
        id: { type: string, format: uuid }
        seq: { type: integer }
        ticket_no: { type: string, example: 17-001-1 }
        status: { type: string, enum: [valid, void] }
        admitted_at: { type: [string, 'null'], format: date-time }
        entry_token:
          type: string
          description: 入場 QR トークン（来場者向け応答・当日受付応答のみ）

    ReservationCoupon:
      type: object
      description: 予約に紐づいて自動発券されたクーポン
      required: [id, coupon_no, name, persons_total, persons_remaining, status, valid_until]
      properties:
        id: { type: string, format: uuid }
        coupon_no: { type: string }
        name: { type: string }
        persons_total: { type: integer }
        persons_remaining: { type: integer }
        status: { $ref: '#/components/schemas/CouponStatus' }
        valid_until: { type: [string, 'null'], format: date-time }
        token: { type: string, description: クーポン QR トークン（来場者向け応答・当日受付応答のみ） }

    Reservation:
      type: object
      description: 予約詳細
      required: [id, reservation_no, kind, name, party_size, status, cancel_reason, created_at, cancelled_at, screening, tickets, coupons]
      properties:
        id: { type: string, format: uuid }
        reservation_no: { type: string }
        kind: { type: string, enum: [advance, walkin] }
        name: { type: string }
        party_size: { type: integer }
        status: { $ref: '#/components/schemas/ReservationStatus' }
        cancel_reason: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        cancelled_at: { type: [string, 'null'], format: date-time }
        screening:
          type: object
          required: [id, title, starts_at, ends_at, run_status, business_day, cancel_reason]
          properties:
            id: { type: string, format: uuid }
            title: { type: string }
            starts_at: { type: string, format: date-time }
            ends_at: { type: string, format: date-time }
            run_status: { $ref: '#/components/schemas/RunStatus' }
            business_day: { type: string, format: date }
            cancel_reason: { type: [string, 'null'] }
        tickets:
          type: array
          items: { $ref: '#/components/schemas/Ticket' }
        coupons:
          type: array
          items: { $ref: '#/components/schemas/ReservationCoupon' }

    ReservationListItem:
      type: object
      required: [id, reservation_no, kind, name, party_size, status, created_at, cancel_reason, screening_id, title,
                 starts_at, has_client_identity, admitted, tickets]
      properties:
        id: { type: string, format: uuid }
        reservation_no: { type: string }
        kind: { type: string, enum: [advance, walkin] }
        name: { type: string }
        party_size: { type: integer }
        status: { $ref: '#/components/schemas/ReservationStatus' }
        created_at: { type: string, format: date-time }
        cancel_reason: { type: [string, 'null'] }
        screening_id: { type: string, format: uuid }
        title: { type: string }
        starts_at: { type: string, format: date-time }
        has_client_identity: { type: boolean }
        admitted: { type: integer, description: 入場済み人数 }
        tickets:
          type: array
          items:
            type: object
            required: [id, ticket_no, status, admitted_at]
            properties:
              id: { type: string, format: uuid }
              ticket_no: { type: string }
              status: { type: string, enum: [valid, void] }
              admitted_at: { type: [string, 'null'], format: date-time }

    CheckinRequest:
      type: object
      additionalProperties: false
      description: '`token`（QR の値。URL 形式 `…/<token>` も可）か `ticket_no` のどちらか。token が優先。'
      properties:
        token: { type: string }
        ticket_no: { type: string, example: 17-001-1 }
        screening_id:
          type: string
          format: uuid
          description: 受付中の上映。指定すると別の回のチケットを `wrong_screening` とする

    TicketInfo:
      type: object
      required: [id, ticket_no, seq, status, reservation_status, reservation_no, name, party_size, screening_id, title, starts_at, run_status]
      properties:
        id: { type: string, format: uuid }
        ticket_no: { type: string }
        seq: { type: integer }
        status: { type: string, enum: [valid, void] }
        reservation_status: { $ref: '#/components/schemas/ReservationStatus' }
        reservation_no: { type: string }
        name: { type: string }
        party_size: { type: integer }
        screening_id: { type: string, format: uuid }
        title: { type: string }
        starts_at: { type: string, format: date-time }
        run_status: { $ref: '#/components/schemas/RunStatus' }
        admitted_at: { type: string, format: date-time, description: 入場済みの場合のみ }

    CheckinResult:
      type: object
      required: [result, message]
      properties:
        result:
          type: string
          description: |
            `ok`（verify のみ：入場可能）, `admitted`（入場確定）, `already_admitted`, `cancelled`（取消済み・無効）,
            `wrong_screening`, `screening_cancelled`, `finished`, `not_found`
          enum: [ok, admitted, already_admitted, cancelled, wrong_screening, screening_cancelled, finished, not_found]
        message: { type: string }
        ticket: { $ref: '#/components/schemas/TicketInfo' }

    ScreeningRuleInput:
      type: object
      additionalProperties: false
      required: [department_id, business_day, title, window_start, window_end, duration_min, capacity]
      properties:
        department_id: { type: string, format: uuid }
        business_day: { type: string, format: date }
        title: { type: string, minLength: 1, maxLength: 50 }
        window_start: { type: string, pattern: '^\d{2}:\d{2}$', example: '10:00' }
        window_end: { type: string, pattern: '^\d{2}:\d{2}$', example: '16:00' }
        interval_min: { type: integer, minimum: 5, default: 15, description: 開始間隔（0 は 15 とみなす） }
        duration_min: { type: integer, minimum: 1 }
        turnover_min: { type: integer, minimum: 0, default: 0, description: duration_min + turnover_min ≦ interval_min }
        capacity: { type: integer, minimum: 1, maximum: 500 }
        reserve_quota: { type: [integer, 'null'], minimum: 0 }
        booking_opens_before_min: { type: [integer, 'null'], description: 上映開始の何分前から予約受付（null=即時） }
        booking_closes_before_min: { type: integer, default: 0 }

    PlannedSlot:
      type: object
      required: [starts_at, ends_at]
      properties:
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        conflict: { type: string, description: 既存枠と重複する場合の理由（作成しない） }

    # ---------------- 現金 ----------------
    CashAccount:
      type: object
      required: [id, name, kind, member_id, active, member_name, kind_order, cash_balance, voucher_balance, pending_transfers, last_reconciliation]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: '#/components/schemas/CashAccountKind' }
        member_id: { type: [string, 'null'], format: uuid }
        active: { type: boolean }
        member_name: { type: [string, 'null'] }
        kind_order: { type: integer, description: '並び順（safe=0, register=1, wallet=2）' }
        cash_balance: { type: integer, description: 現金の理論残高 }
        voucher_balance: { type: integer, description: 金券の理論残高 }
        pending_transfers: { type: integer }
        last_reconciliation:
          type: [object, 'null']
          description: 直近の現金精算
          required: [created_at, difference]
          properties:
            created_at: { type: string, format: date-time }
            difference: { type: integer }

    CashDestination:
      type: object
      required: [id, name, kind, member_name, kind_order]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: '#/components/schemas/CashAccountKind' }
        member_name: { type: [string, 'null'], description: 個人財布の持ち主 }
        kind_order: { type: integer, description: '並び順（safe=0, register=1, wallet=2）' }

    CashAccountsResponse:
      type: object
      required: [accounts, total, can_view_all]
      properties:
        accounts:
          type: array
          items: { $ref: '#/components/schemas/CashAccount' }
        total:
          type: object
          description: 全保管先の合計（can_view_all=false のときは 0）
          required: [cash, voucher]
          properties:
            cash: { type: integer }
            voucher: { type: integer }
        can_view_all: { type: boolean }

    CashEntry:
      type: object
      required: [id, medium, kind, amount, reason, created_at, member_name, call_number, transfer_id, reconciliation_id]
      properties:
        id: { type: integer }
        medium: { $ref: '#/components/schemas/CashMedium' }
        kind: { type: string, enum: [opening, sale, refund, transfer_in, transfer_out, adjustment] }
        amount: { type: integer, description: 符号付き（出金は負） }
        reason: { type: string }
        created_at: { type: string, format: date-time }
        member_name: { type: string }
        call_number: { type: [integer, 'null'], description: 売上の場合の注文呼出番号 }
        transfer_id: { type: [string, 'null'], format: uuid }
        reconciliation_id: { type: [string, 'null'], format: uuid }

    CashTransfer:
      type: object
      required: [id, kind, medium, amount, status, reason, created_at, decided_at, from_account_id, from_name,
                 to_account_id, to_name, requested_by_name, decided_by_name, can_confirm, can_cancel]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [handover, collection] }
        medium: { $ref: '#/components/schemas/CashMedium' }
        amount: { type: integer }
        status: { $ref: '#/components/schemas/TransferStatus' }
        reason: { type: string }
        created_at: { type: string, format: date-time }
        decided_at: { type: [string, 'null'], format: date-time }
        from_account_id: { type: string, format: uuid }
        from_name: { type: string }
        to_account_id: { type: string, format: uuid }
        to_name: { type: string }
        requested_by_name: { type: string }
        decided_by_name: { type: [string, 'null'] }
        can_confirm: { type: boolean, description: 閲覧者が確認・差し戻しできるか（status は考慮しない） }
        can_cancel: { type: boolean, description: 閲覧者が申請者か }

    Reconciliation:
      type: object
      required: [id, medium, theoretical_balance, actual_balance, difference, note, created_at, account_name, counted_by_name, confirmed_by_name]
      properties:
        id: { type: string, format: uuid }
        medium: { $ref: '#/components/schemas/CashMedium' }
        theoretical_balance: { type: integer }
        actual_balance: { type: integer }
        difference: { type: integer }
        note: { type: string }
        created_at: { type: string, format: date-time }
        account_name: { type: string }
        counted_by_name: { type: string }
        confirmed_by_name: { type: string }

    SalesRow:
      type: object
      required: [key, orders, quantity, gross, discount, paid, unpaid, refunded, net]
      properties:
        key: { type: string, description: 集計キー（合計行は「合計」） }
        orders: { type: integer }
        quantity: { type: integer }
        gross: { type: integer, description: 値引前金額 }
        discount: { type: integer }
        paid: { type: integer, description: 入金（値引後） }
        unpaid: { type: integer, description: 受付中・未払いの金額 }
        refunded: { type: integer }
        net: { type: integer, description: paid − refunded }

    SalesReport:
      type: object
      required: [group, label, rows, total]
      properties:
        group: { type: string, enum: [day, department, product, hour, cashier] }
        label: { type: string, description: 集計単位の表示名（例 営業日） }
        rows:
          type: array
          items: { $ref: '#/components/schemas/SalesRow' }
        total: { $ref: '#/components/schemas/SalesRow' }

    # ---------------- シフト ----------------
    ShiftSlot:
      type: object
      required: [id, business_day, location, starts_at, ends_at, required_count, note, active, assigned_count,
                 assignments, my_request, mine, requests]
      properties:
        id: { type: string, format: uuid }
        business_day: { type: string, format: date }
        location: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        required_count: { type: integer }
        note: { type: string }
        active: { type: boolean }
        assigned_count: { type: integer }
        assignments:
          type: array
          items:
            type: object
            required: [id, member_id, member_name]
            properties:
              id: { type: string, format: uuid, description: 配置 ID }
              member_id: { type: string, format: uuid }
              member_name: { type: string }
        my_request:
          type: [object, 'null']
          required: [preference, note]
          properties:
            preference: { $ref: '#/components/schemas/ShiftPreference' }
            note: { type: string }
        mine: { type: boolean, description: 自分が配置されている }
        requests:
          type: [array, 'null']
          description: 全員の希望（admin のみ。それ以外は null）
          items:
            type: object
            required: [member_id, member_name, preference, note]
            properties:
              member_id: { type: string, format: uuid }
              member_name: { type: string }
              preference: { $ref: '#/components/schemas/ShiftPreference' }
              note: { type: string }

    ShiftExchange:
      type: object
      required: [id, status, reason, created_at, responded_at, decided_at, from_member_id, from_name, to_member_id,
                 to_name, decided_by_name, location, starts_at, ends_at]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [requested, accepted, approved, declined, rejected, cancelled] }
        reason: { type: string }
        created_at: { type: string, format: date-time }
        responded_at: { type: [string, 'null'], format: date-time }
        decided_at: { type: [string, 'null'], format: date-time }
        from_member_id: { type: string, format: uuid }
        from_name: { type: string }
        to_member_id: { type: string, format: uuid }
        to_name: { type: string }
        decided_by_name: { type: [string, 'null'] }
        location: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }

    ExchangeResponseAction:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          type: string
          enum: [accept, decline, cancel]
          description: 'accept/decline=依頼相手, cancel=申請者'
        reason: { type: string }

    ExchangeDecision:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          type: string
          enum: [approve, reject]
        reason: { type: string, description: 両者への通知本文 }

    # ---------------- ブロック ----------------
    AccessBlock:
      type: object
      required: [id, scope, reason, source_type, source_id, starts_at, ends_at, lifted_at, lift_reason, created_at,
                 client_kind, created_by_name, lifted_by_name, effective]
      properties:
        id: { type: string, format: uuid }
        scope: { $ref: '#/components/schemas/BlockScope' }
        reason: { type: string }
        source_type: { type: [string, 'null'], enum: [order, reservation, null] }
        source_id: { type: [string, 'null'], format: uuid }
        starts_at: { type: string, format: date-time }
        ends_at: { type: [string, 'null'], format: date-time }
        lifted_at: { type: [string, 'null'], format: date-time }
        lift_reason: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        client_kind: { type: string, enum: [web, appclip, ios, android] }
        created_by_name: { type: string }
        lifted_by_name: { type: [string, 'null'] }
        effective: { type: boolean, description: 未解除かつ期限内 }
