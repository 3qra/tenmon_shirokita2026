                duration_min: { type: integer, minimum: 1 }
                turnover_min: { type: integer, minimum: 0, default: 0 }
                capacity: { type: integer, minimum: 1 }
                reserve_quota: { type: [integer, 'null'], minimum: 0, description: 事前予約枠（null=定員まで） }
                booking_opens_at: { type: [string, 'null'], format: date-time }
                booking_closes_at: { type: [string, 'null'], format: date-time }
                visibility: { $ref: '#/components/schemas/Visibility' }
