      description: |
        必要権限: kitchen / cashier / admin。
        許可される遷移: waiting→cooking|cooked, cooking→cooked|waiting, cooked→cooking（それ以外 `400`）。
        調理不要の明細は `400`。`from` が現状と異なる（他端末で変更済み）`409 state_changed`。
        注文が取消済み・受渡済み `409 order_closed`。
