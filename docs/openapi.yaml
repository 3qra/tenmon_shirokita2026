      description: |
        必要権限: cashier / treasurer / admin。クーポンエラーは 404 / 422（`coupon_used`, `coupon_revoked`,
        `coupon_not_yet`, `coupon_expired`, `coupon_persons`, `coupon_not_combinable`, `coupon_not_applicable`, `coupon_no_target`）。
