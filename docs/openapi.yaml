openapi: 3.1.0
info:
  title: 学祭部活ポータル API
  version: 1.0.0
  summary: 模擬店モバイルオーダー・プラネタリウム予約・現金管理・シフト管理のREST API
  description: |
    Go 実装（`api/internal/app`）に基づく仕様。ルーティングは `routes.go`。

    ## 共通事項

    * 金額はすべて整数の円。時刻は RFC 3339（タイムゾーン付き）。営業日（`business_day`）は Asia/Tokyo 基準の `YYYY-MM-DD`。
    * リクエスト本文は JSON（最大 1 MiB）。**未知のフィールドは拒否**（`400 bad_request`）。空本文は `{}` として扱う。
    * パス中の `{id}` 等の UUID が UUID 形式でない場合は `404 not_found` を返す（`pathID`）。
    * 応答には `Cache-Control: no-store`、`X-Content-Type-Options: nosniff`、`Referrer-Policy: no-referrer`、`X-Frame-Options: DENY` が付く。
    * CORS は `ALLOWED_ORIGINS` に列挙したオリジンのみ（資格情報付き）。

    ## 認証（スタッフ）

    `POST /auth/login` 成功時に HttpOnly Cookie `gs_session`（SameSite=Lax）を設定し、同じ値を `token` として返す。
    アプリ等は `Authorization: Bearer <token>` で送ってもよい（Bearer が優先、無ければ Cookie）。
    セッション期限は既定 18 時間（`SESSION_TTL`）。

    権限（ロール）: `admin`, `treasurer`, `cashier`, `kitchen`, `reception`, `member`, `display`。
    各操作の必要権限は `x-roles`（いずれか1つを持てばよい）と説明文に記載。`x-roles: []` はログインのみ必要。
    ログインしていなければ `401 unauthorized`、権限不足は `403 forbidden`。

    ## CSRF 対策

    `/api/` 配下の GET/HEAD/OPTIONS 以外の要求で、`Authorization: Bearer ...` ヘッダが**無い**場合は
    `X-Requested-With` ヘッダ（値は任意・空でないこと）が必須。無ければ `403 csrf`。
    `Bearer ` で始まらない `Authorization` ヘッダでは免除されない。
    これは来場者向け公開 API（Cookie `gs_cid` を使う）にも適用される。

    ## 冪等性キー（Idempotency-Key）

    `Idempotency-Key` ヘッダ必須の操作がある（各操作に `x-idempotent: true` と記載）。
    * ヘッダが無い／200 文字超 → `400 bad_request`。
    * キー空間は「操作種別 + 呼び出し主体（セッショントークン・`X-Client-Id`・Cookie `gs_cid` のハッシュ）」で分かれる。
      セッションも `X-Client-Id` も有効な `gs_cid`（16 文字以上）も無い来場者の要求では、冪等性処理の前に
      `gs_cid` を新規発行（`Set-Cookie`）してから主体を決めるため、別の来場者同士でキーが衝突しない。
    * 同じキー・同じ内容（メソッド + パス + 本文のハッシュが一致）→ 保存済みの応答（ステータス・本文）を再送し、
      `Idempotent-Replay: true` ヘッダを付ける（初回のその他のヘッダ、例えば `Set-Cookie` は再送されない）。
    * 同じキー・異なる内容 → `422 idempotency_mismatch`。
    * 同じキーの要求が処理中 → `409 in_progress`。
    * 初回処理が 5xx / 409 / 429 で終わった場合は記録を消すので、同じキーで再試行できる。
      それ以外（2xx・400・401・403・404・422 など）は保存され、以後は再送される。
    * スタッフ用の操作（`/staff/*`, `/treasurer/*`）は**認証・権限確認の後**に冪等性処理を行う。
      401/403 は記録されず、同じキーでログイン後に再試行できる。

    ## 来場者識別

    注文作成・予約作成で来場者を識別する（同一人物の断定には使わない。上限・ブロック判定用）。
    * アプリ: `X-Client-Id`（16〜200 文字）と `X-Client-Kind`（`appclip` | `ios` | `android`）を送る。
      `X-Client-Id` があるのに `X-Client-Kind` が不正なら `400`。
    * Web: Cookie `gs_cid`（16〜100 文字）。`X-Client-Id` が無く有効な `gs_cid` も無い場合、
      `GET /api/v1/public/*` の任意の要求、および冪等性キー付きの公開 POST（注文・予約作成）で
      新たに発行して `Set-Cookie`（30 日, Path=/, HttpOnly, SameSite=Lax）する。
      注文・予約の作成前に公開 GET を 1 回呼んでおけば識別が安定する。

    ## エラー形式

    すべてのエラーは `{"error": {"code": "...", "message": "...", "details": {...}}}`。
    `message` は利用者に表示できる日本語。`code` は機械判定用（一覧は `components.schemas.ErrorCode`）。
    DB 制約違反は汎用コードに変換される: 一意制約 `409 duplicate`、CHECK 制約 `400 invalid_value`、
    排他制約 `409 overlap`、外部キー `400 bad_request`、型不正 `400 bad_request`、
    直列化失敗・デッドロック（再試行後） `409 retry`、それ以外は `500 internal`。

    ## リアルタイム通知（SSE）

    `GET /events` は「どのトピックが変わったか」だけを配信する。受信側は該当 API を取り直す。
    トピック: `orders:<departmentId>`, `screenings`, `cash`, `shifts`, `products`, `departments`, `resync`。
  contact:
    name: 天文学研究部
servers:
  - url: /api/v1
    description: 同一オリジンの API（相対パス）
tags:
  - name: common
    description: 共通
  - name: auth
    description: 認証・本人
  - name: public
    description: 来場者向け（ログイン不要）
  - name: display
    description: 表示端末
  - name: staff-orders
    description: スタッフ：注文・会計・キッチン・クーポン読取
  - name: staff-planetarium
    description: スタッフ：プラネタリウム受付
  - name: staff-cash
    description: スタッフ：現金
  - name: treasurer
    description: 会計責任者
  - name: shifts
    description: シフト・通知
  - name: admin
    description: 管理

security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  # ------------------------------------------------------------------
  # 共通
  # ------------------------------------------------------------------
  /healthz:
    servers:
      - url: /
        description: API プレフィックスなし
    get:
      tags: [common]
      operationId: healthz
      summary: ヘルスチェック
      description: DB に ping する。`/api/v1` の外（`/healthz`）にある。
      security: []
      x-roles: public
      responses:
        '200':
          description: 正常
          content:
            application/json:
              schema:
                type: object
                required: [ok, time]
                properties:
                  ok: { type: boolean, const: true }
                  time: { type: string, format: date-time }
        '503':
          description: DB に接続できない
          content:
            application/json:
              schema:
                type: object
                required: [ok, db]
                properties:
                  ok: { type: boolean, const: false }
                  db: { type: string, description: DB エラー文字列 }

  /events:
    get:
      tags: [common]
      operationId: streamEvents
      summary: 変更通知ストリーム（SSE）
      description: |
        Server-Sent Events。認証不要。接続直後に `hello`、以後 15 秒ごとに `ping` を送る。
        変更があると `event: change` で `data` にトピック名を送る。

        ```
        event: hello
        data: 1760610000

        event: ping
        data: 1760610015

        event: change
        data: orders:b5092b0f-bc95-4b8e-bb83-505e79438a54
        ```

        * `hello` / `ping` の `data` はサーバー時刻（Unix 秒）。
        * `change` の `data`: `orders:<departmentId>`（注文・調理・会計・返金・受渡）、`screenings`（上映・予約・入場）、
          `cash`（入金・返金・現金移動・精算）、`shifts`、`products`、`departments`、`resync`。
        * `resync` は DB 通知の再接続時などに送られ、`topics` の指定にかかわらず常に届く。受信側は全件を取り直すこと。
        * 遅い購読者への通知は取りこぼされることがある。切断時は再接続して全件再取得する。
      security: []
      x-roles: public
      parameters:
        - name: topics
          in: query
          required: false
          description: |
            購読するトピックのカンマ区切り。`orders` のように `:` より前の基底名を指定すると `orders:*` すべてに一致する。
            `orders:<departmentId>` のように完全一致でもよい。省略時はすべて。
          schema: { type: string }
          example: orders,screenings
      responses:
        '200':
          description: 'イベントストリーム（`X-Accel-Buffering: no`）'
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                stream:
                  value: "event: hello\ndata: 1760610000\n\nevent: change\ndata: screenings\n\n"
        '500':
          $ref: '#/components/responses/InternalError'

  /business-days:
    get:
      tags: [common]
      operationId: listBusinessDays
      summary: 営業日一覧と今日の営業日
      security: []
      x-roles: public
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessDaysResponse' }

  # ------------------------------------------------------------------
  # 認証
  # ------------------------------------------------------------------
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: ログイン
      description: |
        成功時に Cookie `gs_session` を設定し、同じ値を `token` で返す。
        IP あたり 10 回/分（`429 rate_limited`）。同じ login_id の失敗が 15 分以内に 10 回で `429 locked`。
        無効化された部員・存在しない ID・パスワード誤りは区別せず `401 invalid_credentials`。
      security: []
      x-roles: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                login_id: { type: string }
                password: { type: string }
      responses:
        '200':
          description: ログイン成功
          headers:
            Set-Cookie:
              description: '`gs_session=<token>; Path=/; HttpOnly; SameSite=Lax`'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: ログアウト
      description: セッションを削除し Cookie を消す。未ログインでも 200。
      security: []
      x-roles: public
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /auth/me:
    get:
      tags: [auth]
      operationId: me
      summary: ログイン中のスタッフと未読通知数
      x-roles: []
      description: '必要権限: ログインのみ'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [staff, unread_notifications]
                properties:
                  staff: { $ref: '#/components/schemas/Staff' }
                  unread_notifications: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: 自分のパスワード変更
      description: |
        必要権限: ログインのみ。新パスワードは 8 文字以上。現在のパスワード誤りは `400 invalid_credentials`。
        成功すると現在のセッション以外のセッションを無効化する。
      x-roles: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current, new]
              properties:
                current: { type: string }
                new: { type: string, minLength: 8 }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ------------------------------------------------------------------
  # 来場者（公開）
  # ------------------------------------------------------------------
  /public/departments:
    get:
      tags: [public]
      operationId: publicListDepartments
      summary: 部門一覧
      security: []
      x-roles: public
      responses:
        '200':
          description: OK（`sort_order`, `name` 順）
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Department' }

  /public/departments/{id}/products:
    get:
      tags: [public]
      operationId: publicCatalog
      summary: 部門の商品カタログ（来場者向け）
      description: 公開・有効な商品／選択肢／バリエーションのみ。無効な選択肢を含むバリエーションは除外。
      security: []
      x-roles: public
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /public/departments/{id}/board:
    get:
      tags: [public]
      operationId: publicBoard
      summary: 呼出番号ボード
      description: 今日の注文のうち、調理中（cooking）と受渡可能（ready）の呼出番号のみ。
      security: []
      x-roles: public
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoardResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /public/orders/quote:
    post:
      tags: [public]
      operationId: publicQuote
      summary: 注文金額の見積（来場者）
      description: 価格・販売状態をサーバー側で検証する。IP あたり 60 回/分（バースト 30）。
      security: []
      x-roles: public
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [department_id, items]
              properties:
                department_id: { type: string, format: uuid }
                items:
                  type: array
                  items: { $ref: '#/components/schemas/ItemRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, subtotal]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PricedItem' }
                  subtotal: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /public/orders:
    post:
      tags: [public]
      operationId: publicCreateOrder
      summary: モバイル注文の作成（来場者）
      description: |
        `Idempotency-Key` 必須。来場者識別（`X-Client-Id`+`X-Client-Kind` または Cookie `gs_cid`）を使う。
        * IP あたり `orders_per_minute` 回/分（設定値）。
        * ブロック中の識別は `403 forbidden`。
        * 部門が `site_code_enabled` の場合、会場表示の 3 桁コード `site_code` が必要（誤り `422 site_code_invalid`、
          失敗が `site_code_fail_limit` 回（IP 単位は 4 倍）続くと `429 site_code_locked`）。
        * 部門が営業中でない `422 not_open`、モバイル受付停止 `422 mobile_order_off`、
          未払い注文が `max_unpaid_orders` 件以上 `422 too_many_unpaid`、数量合計が `max_items_per_order` 超 `422 too_many_items`。
        * 商品の不正 `422 invalid_item` / `item_unavailable` / `sold_out` / `item_stopped`。
        応答の `access_token` は注文状況確認用の秘密トークン（再表示不可）。
      security: []
      x-roles: public
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XRequestedWith'
        - $ref: '#/components/parameters/XClientId'
        - $ref: '#/components/parameters/XClientKind'
        - $ref: '#/components/parameters/ClientCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [department_id, items]
              properties:
                department_id: { type: string, format: uuid }
                items:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/ItemRequest' }
                site_code:
                  type: string
                  description: 会場に表示された 3 桁の確認コード（部門で有効な場合のみ必要）
                  example: '042'
                channel:
                  type: string
                  enum: ['', web, appclip, ios, android]
                  default: web
      responses:
        '201':
          description: 作成
          headers:
            Set-Cookie:
              description: 来場者 Cookie `gs_cid` を新規発行した場合
              schema: { type: string }
            Idempotent-Replay:
              $ref: '#/components/headers/IdempotentReplay'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicOrderCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /public/orders/by-token/{token}:
    get:
      tags: [public]
      operationId: publicGetOrder
      summary: 注文状況（来場者・トークン）
      description: IP あたり 120 回/分（バースト 60）。
      security: []
      x-roles: public
      parameters:
        - $ref: '#/components/parameters/TokenPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /public/orders/by-token/{token}/cancel:
    post:
      tags: [public]
      operationId: publicCancelOrder
      summary: 注文の本人取消
      description: |
        受付中（accepted）・未払い・調理開始前の注文のみ。
        取消不可 `409 not_cancellable`、支払済み `409 paid`、調理開始済み `409 cooking_started`。
      security: []
      x-roles: public
      parameters:
        - $ref: '#/components/parameters/TokenPath'
        - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200':
          description: 取消後の注文
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /public/screenings:
    get:
      tags: [public]
      operationId: publicListScreenings
      summary: 上映一覧（来場者）
      description: 公開かつ終了前（`ends_at > now`）の上映。定員の内訳は返さず記号と可否のみ。
      security: []
      x-roles: public
      parameters:
        - $ref: '#/components/parameters/DayQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [screenings, server_time]
                properties:
                  screenings:
                    type: array
                    items: { $ref: '#/components/schemas/PublicScreening' }
                  server_time: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/BadRequest' }

  /public/screenings/{id}:
    get:
      tags: [public]
      operationId: publicGetScreening
      summary: 上映詳細（来場者）
      description: 非公開の上映は 404。
      security: []
      x-roles: public
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicScreeningDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /public/screening-board:
    get:
      tags: [public]
      operationId: publicScreeningBoard
      summary: 上映案内ボード（今日・終了前の公開上映を最大 12 件）
      security: []
      x-roles: public
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [screenings, server_time]
                properties:
                  screenings:
                    type: array
                    maxItems: 12
                    items: { $ref: '#/components/schemas/ScreeningBoardItem' }
                  server_time: { type: string, format: date-time }

  /public/reservations:
    post:
      tags: [public]
      operationId: publicCreateReservation
      summary: 上映の事前予約（来場者）
      description: |
        `Idempotency-Key` 必須。来場者識別を使う。IP あたり `reservations_per_minute` 回/分。
        * 人数は 1〜`max_party_size`（範囲外 `400`）。
        * 同一識別の将来の有効予約が `max_future_reservations` 件以上 `422 too_many_reservations`。
        * ブロック中 `403 forbidden`、部門が paused/closed `422 not_open`、中止 `422 screening_cancelled`、
          受付外 `422 booking_closed`、満席 `422 full`、残席不足 `422 not_enough_seats`。
        応答の `access_token`/`url` は予約確認用（再表示不可、紛失時はスタッフが再発行）。
      security: []
      x-roles: public
      x-idempotent: true
