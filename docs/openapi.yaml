        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /staff/cash/transfers:
    post:
      tags: [staff-cash]
      operationId: staffRequestTransfer
      summary: 現金の引継ぎ・回収の申請
      description: |
        必要権限: cashier / treasurer / admin。`Idempotency-Key` 必須。
        cashier は自分の財布または共用レジからのみ申請可。移動先が金庫なら `kind` は `collection` に置き換わる。
        理論残高 −申請中額 を超える `422 insufficient_balance`。受取側（または treasurer 全員）に通知する。
      x-roles: [cashier, treasurer, admin]
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [from_account_id, to_account_id, amount]
              properties:
                from_account_id: { type: string, format: uuid }
                to_account_id: { type: string, format: uuid }
                amount: { type: integer, minimum: 1 }
                medium: { $ref: '#/components/schemas/CashMedium' }
                kind:
                  type: string
                  enum: [handover, collection]
                  default: handover
                reason: { type: string }
      responses:
        '201':
          description: 申請作成
          headers:
            Idempotent-Replay:
              $ref: '#/components/headers/IdempotentReplay'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    get:
      tags: [staff-cash]
      operationId: staffListTransfers
      summary: 現金移動の一覧（最新 300 件）
      description: |
        必要権限: cashier / treasurer / admin。cashier は自分が関係する（移動元・移動先の財布の持ち主、申請者）もののみ。
      x-roles: [cashier, treasurer, admin]
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TransferStatus' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CashTransfer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /staff/cash/destinations:
    get:
      tags: [staff-cash]
      operationId: staffCashDestinations
      summary: 現金移動の移動先候補
      description: |
        必要権限: cashier / treasurer / admin。有効な保管先すべて（持ち主が無効な部員の財布は除く）。
        残高は含まない。並び順は金庫 → 共用レジ → 個人財布、同種内は名前順。
      x-roles: [cashier, treasurer, admin]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CashDestination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /staff/cash/transfers/{id}/decide:
    post:
      tags: [staff-cash]
      operationId: staffDecideTransfer
      summary: 現金移動の確認・差し戻し・取り下げ
      description: |
        必要権限: cashier / treasurer / admin。
        * `confirm`: 受取側（財布の持ち主、金庫・レジは treasurer / admin）のみ。自分で申請した金庫・レジ宛ての回収は admin 以外確認不可。
          移動元残高不足 `422 insufficient_balance`。
        * `reject`: 受取側のみ。`reason` 必須。
        * `cancel`: 申請者または admin。
        処理済み `409 decided`。
      x-roles: [cashier, treasurer, admin]
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              properties:
                action: { type: string, enum: [confirm, reject, cancel] }
                reason: { type: string, maxLength: 200 }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

