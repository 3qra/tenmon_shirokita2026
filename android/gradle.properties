org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# ---- 接続先（秘密情報ではない）----
# リリースビルドのAPIベースURL（末尾スラッシュなし。/api/v1 はアプリ側で付与）
API_BASE_URL=https://example.com
# デバッグビルドのAPIベースURL（エミュレーターからホストPCは 10.0.2.2）
API_BASE_URL_DEBUG=http://10.0.2.2:8080
# スタッフ用Web画面を開くときのベースURL
WEB_BASE_URL=https://example.com
WEB_BASE_URL_DEBUG=http://10.0.2.2:3000
# App Links のホスト名（assetlinks.json を置くドメイン）
APP_LINK_HOST=example.com

# 署名情報はここに書かず、~/.gradle/gradle.properties か環境変数で渡す（README参照）
